; LGA Layout ToolPack - Valores de fabrica de cada herramienta.
;
; ESTE ARCHIVO NO ES TU CONFIGURACION: son los valores con los que arranca
; el pack. Editarlo funciona, pero viaja adentro del pack y el instalador
; lo reemplaza en cada update, asi que la edicion se pierde ahi.
;
; Para activar o desactivar herramientas: menu TPL > Enable Tools.
; Eso guarda tu eleccion fuera del pack y ningun update la toca.

[Tools]
; === DOTS ===
Add_Dots_Before = True
Dots_After_System = True

; === UTILITIES ===
Script_Checker = True
StickyNote = True

; === BACKDROPS ===
LGA_Backdrop_System = True

; === NODE LABELS ===
NodeLabel = True
AutoStamps = True

; === SELECT NODES ===
Layout_Panel = True
Select_Nodes = True

; === ALIGN & DISTRIBUTE ===
Align_Nodes = True
Distribute_Nodes = True

; === ORGANIZE ===
Arrange_Nodes = True
Scale_Nodes = True

; === PUSH & PULL ===
Push_Pull_Nodes = True

; === NAVIGATE ===
Easy_Navigate = True

; === ZOOM ===
Toggle_Zoom = True
